services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: urbanrisk
      POSTGRES_USER: urbanrisk
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    volumes:
      - urbanrisk-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbanrisk -d urbanrisk"]
      interval: 5s
      timeout: 3s
      retries: 12
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/urbanrisk
      DB_USER: urbanrisk
      DB_PASSWORD: ${DB_PASSWORD:-local-development-only}
      INGEST_TOKEN: ${INGEST_TOKEN:-local-demo-only}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8081,http://127.0.0.1:8081}
    depends_on:
      db:
        condition: service_healthy
volumes:
  urbanrisk-data:
