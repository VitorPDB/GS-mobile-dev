name: Verify application
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-h2-results
          path: backend/target/surefire-reports/
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: urip_test
          POSTGRES_USER: urip_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U urip_test -d urip_test"
          --health-interval 5s --health-timeout 3s --health-retries 12
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/urip_test
      SPRING_DATASOURCE_USERNAME: urip_test
      SPRING_DATASOURCE_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-postgres-results
          path: backend/target/surefire-reports/
  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm run doctor
      - run: npm run check:android
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web
      - run: npx expo export --platform android --output-dir dist-android
      - name: Record dependency audit (known upstream advisory in SECURITY.md)
        if: always()
        continue-on-error: true
        run: npm audit --json > npm-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-config-and-audit
          path: |
            mobile/verification-results/android-config.json
            mobile/npm-audit.json
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, postgres, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: mvn -B -f backend/pom.xml package
      - run: npm ci
        working-directory: mobile
      - run: npm run build:web
        working-directory: mobile
      - run: npx playwright install --with-deps chromium
        working-directory: mobile
      - run: npm run test:e2e
        working-directory: mobile
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            mobile/test-results/
            mobile/playwright-report/
            docs/images/
